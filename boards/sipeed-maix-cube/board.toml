schema = 1
id = "sipeed-maix-cube"
platform = "kendryte-k210"
support = "conformance"
releaseable = false
# Compile-conformance only. Present hardware is not driver-supported.
available = ["processor"]
present = [
  "processor",
  "internal-flash",
  "display",
  "camera",
  "buttons",
  "lights",
  "sd-card",
]

[defaults]
lcd_width = 240
lcd_height = 240

[flash]
address_bytes = 3
minimum_capacity = 0x01000000
maximum_capacity = 0x01000000
erase_size = 0x00001000
program_size = 0x00000100

[[partitions]]
name = "firmware"
offset = 0x00000000
size = 0x00800000
required_capacity = 0x01000000
runtime_writable = false

[[partitions]]
name = "reserved"
offset = 0x00800000
size = 0x00800000
required_capacity = 0x01000000
runtime_writable = false

[programming]
supported = false
reset_profile = "manual"

[programming.usb_detection]
mode = "explicit-port"
