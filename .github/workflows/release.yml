name: Release firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: _deps
          key: kendryte-windows-${{ hashFiles('tools/bootstrap_deps.py') }}

      - name: Install Python dependencies
        run: python -m pip install pyserial

      - name: Bootstrap pinned Kendryte dependencies
        run: python tools/bootstrap_deps.py

      - name: Validate source and environment
        run: |
          python tools/check_arch.py
          python tools/check_env.py

      - name: Build full firmware
        run: python tools/build_firmware.py full

      - name: Package release
        shell: pwsh
        run: |
          $releaseTag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$((Get-Content VERSION -Raw).Trim())" }
          python tools/package_release.py --tag $releaseTag

      - name: Preserve CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hackylens-${{ github.ref_name }}
          path: dist/

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes --title "HackyLens ${{ github.ref_name }}"
