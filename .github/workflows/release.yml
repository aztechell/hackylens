name: Release firmware

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host GCC
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - uses: actions/cache@v4
        with:
          path: _deps
          key: kendryte-windows-${{ hashFiles('tools/bootstrap_deps.py') }}

      - name: Configure host GCC
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $hostGcc = Join-Path $env:MSYS2_LOCATION "ucrt64\bin\gcc.exe"
          if (-not (Test-Path -LiteralPath $hostGcc)) {
            throw "setup-msys2 did not install UCRT64 GCC at $hostGcc"
          }
          Split-Path -Parent $hostGcc |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$hostGcc" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python dependencies
        run: python -m pip install pyserial

      - name: Bootstrap pinned Kendryte dependencies
        run: python tools/bootstrap_deps.py

      - name: Validate source and environment
        run: |
          python tools/check_docs.py
          python tools/check_arch.py
          python tools/gen_flash_layout.py --check
          python tools/check_env.py
          python tools/run_tests.py

      - name: Build firmware without MicroPython and verify isolation
        run: |
          python tools/build_firmware.py full --disable-app micropython
          python tools/check_firmware_symbols.py build/sdk-full/hackylens_full --expect absent

      - name: Build full firmware and verify feature symbols
        run: |
          python tools/build_firmware.py full
          python tools/check_firmware_symbols.py build/sdk-full/hackylens_full --expect present

      - name: Package release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        run: |
          python tools/package_release.py --tag "${{ github.ref_name }}"

      - name: Upload release payload
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: hackylens-${{ github.ref_name }}
          path: dist/release/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: validate
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hackylens-${{ github.ref_name }}
          path: dist/release

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/release/* --verify-tag --generate-notes --title "HackyLens ${{ github.ref_name }}"
