schema = 1
source_roots = [
  "sdk/include",
  "sdk/host",
  "firmware/include",
  "firmware/src",
  "firmware/generated",
  "firmware/assets",
  "firmware/config",
  "firmware/targets",
  "boards",
  "platforms",
]

[[layers]]
name = "sdk"
paths = ["sdk/include/**"]

[[layers]]
name = "sdk-host"
paths = ["sdk/host/**"]

[[layers]]
name = "public-capability"
paths = [
  "firmware/include/hackylens/capability/**",
  "firmware/src/capabilities/display.c",
  "firmware/src/capabilities/external_link.c",
  "firmware/src/capabilities/input.c",
  "firmware/src/capabilities/lights.c",
  "firmware/src/capabilities/time.c",
]

[[layers]]
name = "app"
paths = [
  "firmware/src/apps/*.c",
  "firmware/src/apps/*.cc",
  "firmware/src/apps/*.cpp",
  "firmware/src/apps/*.cxx",
  "firmware/src/apps/*.h",
  "firmware/src/apps/*.hh",
  "firmware/src/apps/*.hpp",
  "firmware/src/apps/*.hxx",
  "firmware/src/apps/**/*.c",
  "firmware/src/apps/**/*.cc",
  "firmware/src/apps/**/*.cpp",
  "firmware/src/apps/**/*.cxx",
  "firmware/src/apps/**/*.h",
  "firmware/src/apps/**/*.hh",
  "firmware/src/apps/**/*.hpp",
  "firmware/src/apps/**/*.hxx",
]

[[layers]]
name = "manifest"
paths = ["firmware/src/apps/*/app.toml"]

[[layers]]
name = "app-runtime"
paths = ["firmware/src/app_runtime/**"]

[[layers]]
name = "generated-app-registry"
paths = [
  "firmware/generated/app_registry/**",
  "build/generated/app_registry/**",
]

[[layers]]
name = "generated-app-composition"
paths = ["firmware/generated/app_composition/**"]

[[layers]]
name = "adapter"
paths = ["firmware/src/adapters/**"]

[[layers]]
name = "capability-implementation"
paths = [
  "firmware/src/capabilities/*.h",
  "firmware/src/capabilities/capability_core.c",
  "firmware/src/capabilities/capability_inventory_generated.c",
  "firmware/src/capabilities/capability_owner.c",
  "firmware/src/capabilities/input_state.c",
  "platforms/*/capabilities/**",
]

[[layers]]
name = "service"
paths = ["firmware/src/services/**"]

[[layers]]
name = "storage"
paths = ["firmware/src/storage/**"]

[[layers]]
name = "driver"
paths = ["firmware/src/drivers/**"]

[[layers]]
name = "board"
paths = ["boards/**"]

[[layers]]
name = "platform-hal"
paths = ["platforms/*/hal/**"]

[[layers]]
name = "platform-startup"
paths = ["platforms/*/startup/**"]

[[layers]]
name = "runtime"
paths = ["firmware/src/runtime/**", "firmware/targets/**"]

[[layers]]
name = "controller"
paths = ["firmware/src/controllers/**"]

[[layers]]
name = "ui"
paths = ["firmware/src/ui/**"]

[[layers]]
name = "core"
paths = ["firmware/src/core/**", "firmware/src/internal/**"]

[[layers]]
name = "config"
paths = ["firmware/src/config/**", "firmware/config/**"]

[[layers]]
name = "asset"
paths = ["firmware/assets/**"]

[[layers]]
name = "third-party"
paths = ["firmware/third_party/**"]

[[forbidden_edges]]
from = ["app"]
to = [
  "board",
  "platform-hal",
  "driver",
  "capability-implementation",
  "app-runtime",
  "manifest",
  "generated-app-registry",
  "generated-app-composition",
]
reason = "apps must use public capabilities or portable boundaries"

[[forbidden_edges]]
from = ["sdk"]
to = [
  "app",
  "adapter",
  "manifest",
  "app-runtime",
  "generated-app-registry",
  "generated-app-composition",
  "capability-implementation",
  "service",
  "storage",
  "driver",
  "board",
  "platform-hal",
  "platform-startup",
  "runtime",
  "controller",
  "ui",
  "core",
  "config",
  "asset",
  "third-party",
]
reason = "the public SDK may depend only on public capability contracts"

[[forbidden_edges]]
from = ["sdk-host"]
to = [
  "app",
  "adapter",
  "manifest",
  "app-runtime",
  "generated-app-registry",
  "generated-app-composition",
  "capability-implementation",
  "service",
  "storage",
  "driver",
  "board",
  "platform-hal",
  "platform-startup",
  "runtime",
  "controller",
  "ui",
  "core",
  "config",
  "asset",
  "third-party",
]
reason = "the host fake may depend only on the public SDK and capabilities"

[[forbidden_edges]]
from = ["app-runtime"]
to = ["app", "manifest", "board", "platform-hal", "driver"]
reason = "app runtime consumes generated descriptors and portable boundaries"

[[forbidden_edges]]
from = ["generated-app-registry"]
to = [
  "manifest",
  "app-runtime",
  "capability-implementation",
  "service",
  "storage",
  "driver",
  "board",
  "platform-hal",
  "platform-startup",
]
reason = "generated app descriptors contain no implementation or hardware policy"

[[forbidden_edges]]
from = ["adapter"]
to = ["board", "platform-hal", "driver"]
reason = "language adapters must not implement hardware access"

[[forbidden_edges]]
from = ["capability-implementation"]
to = ["app", "adapter"]
reason = "capability implementations must not depend on consumers"

[[forbidden_edges]]
from = ["service"]
to = ["app"]
reason = "services must not include feature-private headers"

[[forbidden_edges]]
from = ["board"]
to = ["app", "adapter", "service", "controller", "ui", "config"]
reason = "boards must not contain app or product policy"
