schema = 1

[consumers.firmware-runtime]
kind = "runtime"
required_capabilities = [
  { id = "hackylens.cap.time", instance = 0, minimum = "0.1.0", maximum_exclusive = "0.2.0", features = ["monotonic-us"] },
]
optional_capabilities = [
  { id = "hackylens.cap.input", instance = 0, minimum = "0.1.0", maximum_exclusive = "0.2.0", features = ["state", "events", "debounced-buttons"], fallback = "conformance-no-runtime-input" },
]

[consumers.hmpy-service]
kind = "service"
enabled_by_app = "micropython"
required_capabilities = []
optional_capabilities = []

[consumers.apriltag-detector]
kind = "service"
enabled_by_app = "apriltag"
required_capabilities = [
  { id = "hackylens.cap.time", instance = 0, minimum = "0.1.0", maximum_exclusive = "0.2.0", features = ["monotonic-us", "sleep-until"] },
]
optional_capabilities = []

[consumers.object-detect-detector]
kind = "service"
enabled_by_app = "object-detect"
required_capabilities = [
  { id = "hackylens.cap.time", instance = 0, minimum = "0.1.0", maximum_exclusive = "0.2.0", features = ["monotonic-us"] },
]
optional_capabilities = []

[consumers.micropython-adapter]
kind = "adapter"
enabled_by_app = "micropython"
required_capabilities = [
  { id = "hackylens.cap.time", instance = 0, minimum = "0.1.0", maximum_exclusive = "0.2.0", features = ["monotonic-us", "sleep-until"] },
  { id = "hackylens.cap.input", instance = 0, minimum = "0.1.0", maximum_exclusive = "0.2.0", features = ["state", "events", "debounced-buttons"] },
  { id = "hackylens.cap.lights", instance = 0, minimum = "0.1.0", maximum_exclusive = "0.2.0", features = ["illumination", "rgb"] },
]
optional_capabilities = []

[consumers.settings-lights]
kind = "service"
required_capabilities = []
optional_capabilities = [
  { id = "hackylens.cap.lights", instance = 0, minimum = "0.1.0", maximum_exclusive = "0.2.0", features = ["backlight", "illumination", "rgb"], fallback = "conformance-no-lights" },
]
