schema = 1
id = "settings"
name = "SETTINGS"
version = "0.1.0"
entry = "settings_enter"
generated_symbol = "hk_generated_app_settings"
lifecycle = "legacy"
sources = ["settings_app.c", "settings_controller.c", "settings_menu.c", "settings_view.c"]
private_includes = []
services = []

[menu]
visible = true
order = 10

[autostart]
eligible = false
id = 0

[capabilities]
required = [
  { id = "hackylens.cap.display", instance = 0, minimum = "0.1.0", maximum_exclusive = "0.2.0", features = ["base-plane", "dirty-regions", "rgb565", "borrowed-surface"] },
  { id = "hackylens.cap.input", instance = 0, minimum = "0.1.0", maximum_exclusive = "0.2.0", features = ["state", "events", "debounced-buttons"] },
  { id = "hackylens.cap.lights", instance = 0, minimum = "0.1.0", maximum_exclusive = "0.2.0", features = ["backlight", "illumination", "rgb"] },
]
optional = [
  { id = "hackylens.cap.external-link", instance = 0, minimum = "0.1.0", maximum_exclusive = "0.2.0", features = ["uart", "i2c-target"], fallback = "hide-external-link-menu" },
]

[limits]
static_ram_bytes = 1048576
stack_bytes = 16384
state_bytes = 262144
tick_interval_us = 10000
tick_budget_us = 1000
render_budget_us = 10000

[metadata]
help = "SETTINGS legacy feature app."
debug = "HKSETTINGS"

[tests]
host_sources = ["settings_app.c"]
build_profiles = ["full", "disabled"]
