schema = 1
id = "face-detect"
name = "FACE DETECT"
version = "0.1.0"
entry = "face_detect_legacy_entry"
generated_symbol = "hk_generated_app_face_detect"
lifecycle = "legacy"
sources = ["face_detect_app.c", "face_detect_controller.c", "face_detect_detector.c", "face_detect_view.c"]
private_includes = []
services = [
  { id = "hackylens.service.legacy-camera", namespace = "face-detect.legacy-camera" },
  { id = "hackylens.service.legacy-sd-card", namespace = "face-detect.legacy-sd-card" },
]

[menu]
visible = true
order = 4

[autostart]
eligible = true
id = 4

[capabilities]
required = [
  { id = "hackylens.cap.display", instance = 0, minimum = "0.1.0", maximum_exclusive = "0.2.0", features = ["base-plane", "dirty-regions", "rgb565", "borrowed-surface"] },
  { id = "hackylens.cap.input", instance = 0, minimum = "0.1.0", maximum_exclusive = "0.2.0", features = ["state", "events", "debounced-buttons"] },
  { id = "hackylens.cap.lights", instance = 0, minimum = "0.1.0", maximum_exclusive = "0.2.0", features = ["illumination", "rgb"] },
]
optional = []

[limits]
static_ram_bytes = 1048576
stack_bytes = 16384
state_bytes = 262144
tick_interval_us = 1000
tick_budget_us = 1000
render_budget_us = 10000

[metadata]
help = "FACE DETECT legacy feature app."
debug = "HKFACEINFO"

[tests]
host_sources = ["face_detect_app.c"]
build_profiles = ["full", "disabled"]
